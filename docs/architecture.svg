  <text x="425" y="503" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a4b7a" text-anchor="middle" dominant-baseline="middle">5. Verifier</text>
  <text x="425" y="519" font-family="Arial, sans-serif" font-size="10" fill="#4a6080" text-anchor="middle" dominant-baseline="middle">Independent Bandit run + sandboxed execution</text>
  <text x="425" y="533" font-family="Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle" dominant-baseline="middle">MCP: Bandit (indep.) · MCP: Sandbox · RAG: CWE</text>
  <text x="425" y="547" font-family="Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle" dominant-baseline="middle">Per-threat PASS / FAIL verdict</text>
  <text x="425" y="558" font-family="Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle" dominant-baseline="middle">(separate state from Code Reviewer — genuine second check)</text>

  <line x1="425" y1="565" x2="425" y2="582" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- JSONL log multi-agent -->
  <rect x="308" y="582" width="234" height="36" rx="4" fill="#f7fafc" stroke="#b0b8c1"/>
  <text x="425" y="595" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" dominant-baseline="middle">Session logged (JSONL)</text>
  <text x="425" y="609" font-family="Arial, sans-serif" font-size="9" fill="#a0aec0" text-anchor="middle" dominant-baseline="middle">condition: "multiagent"</text>

