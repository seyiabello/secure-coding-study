  <!-- TOOL INTEGRATIONS                                                  -->
  <!-- ================================================================ -->

  <!-- THREAT MODELLER tools -->
  <!-- RAG: CWE Top 25 -->
  <rect x="560" y="221" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="231" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">RAG</text>
  <text x="598" y="231" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> CWE Top 25 corpus</text>
  <text x="572" y="243" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">ChromaDB · text-embedding-3-small · LLM rerank</text>

  <!-- NIST NVD -->
  <rect x="560" y="255" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="265" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">MCP</text>
  <text x="598" y="265" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> NIST NVD — live CVEs</text>
  <text x="572" y="277" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">stdio transport · real-time vulnerability data</text>

  <!-- Connectors for TM tools -->
  <line x1="542" y1="235" x2="560" y2="235" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>
  <line x1="542" y1="269" x2="560" y2="269" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>

  <!-- CODE REVIEWER tool -->
  <rect x="560" y="407" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="417" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">MCP</text>
  <text x="598" y="417" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> Bandit — static analysis</text>
  <text x="572" y="429" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">Python security linter · stored as bandit_findings_review</text>

  <!-- Connector for CR -->
  <line x1="542" y1="421" x2="560" y2="421" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>

  <!-- VERIFIER tools -->
  <!-- Bandit (independent) -->
  <rect x="560" y="491" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="501" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">MCP</text>
  <text x="598" y="501" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> Bandit (independent run)</text>
  <text x="572" y="513" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">Stored as bandit_findings_verify — never shared with CR</text>

  <!-- Sandbox -->
  <rect x="560" y="525" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="535" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">MCP</text>
  <text x="598" y="535" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> Sandbox — code execution</text>
  <text x="572" y="547" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">Isolated subprocess · catches runtime failures</text>

  <!-- RAG CWE (verifier independent) -->
  <rect x="560" y="559" width="210" height="28" rx="4" fill="#fff8dc" stroke="#d6b656"/>
  <text x="572" y="569" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a5c00" dominant-baseline="middle">RAG</text>
  <text x="598" y="569" font-family="Arial, sans-serif" font-size="10" fill="#555" dominant-baseline="middle"> CWE Top 25 (independent re-query)</text>
  <text x="572" y="581" font-family="Arial, sans-serif" font-size="8.5" fill="#888" dominant-baseline="middle">Re-queried independently from Threat Modeller</text>

  <!-- Connectors for Verifier -->
  <line x1="542" y1="505" x2="560" y2="505" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>
  <line x1="542" y1="539" x2="560" y2="539" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>
  <line x1="542" y1="573" x2="560" y2="573" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>

  <!-- ================================================================ -->
  <!-- LEGEND                                                             -->
  <!-- ================================================================ -->
  <rect x="848" y="78" width="234" height="156" rx="5" fill="#f9fafb" stroke="#dde2e8"/>
  <text x="862" y="96" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4a5568" dominant-baseline="middle">Legend</text>

  <rect x="862" y="108" width="24" height="14" rx="2" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="892" y="115" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">AI Agent (GPT-4o)</text>

  <rect x="862" y="130" width="24" height="14" rx="2" fill="#d5e8d4" stroke="#82b366"/>
  <text x="892" y="137" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">HITL checkpoint</text>

  <rect x="862" y="152" width="24" height="14" rx="2" fill="#fff8dc" stroke="#d6b656"/>
  <text x="892" y="159" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">External tool (MCP / RAG)</text>

  <rect x="862" y="174" width="24" height="14" rx="2" fill="#f7fafc" stroke="#b0b8c1"/>
  <text x="892" y="181" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">Data input / output</text>

  <line x1="862" y1="203" x2="886" y2="203" stroke="#b89a1e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ahd)"/>
  <text x="892" y="203" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">Tool connection</text>

  <line x1="862" y1="222" x2="886" y2="222" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="892" y="222" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" dominant-baseline="middle">Control / data flow</text>

  <!-- ================================================================ -->
  <!-- EVALUATION BAR                                                     -->
  <!-- ================================================================ -->
  <rect x="18" y="644" width="1064" height="46" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="661" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle" dominant-baseline="middle">Evaluation</text>
  <text x="550" y="678" font-family="Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" dominant-baseline="middle">Independent Bandit scoring on both conditions · Severity weights HIGH=3 / MEDIUM=2 / LOW=1 · Mann-Whitney U test · Effect size r = Z / √N</text>

